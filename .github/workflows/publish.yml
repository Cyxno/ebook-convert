name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ebook-convert
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ghcr.io/cyxno/ebook-convert:test
          provenance: false

      - name: Smoke test
        run: |
          docker run --rm --network none ghcr.io/cyxno/ebook-convert:test --version
          docker image inspect ghcr.io/cyxno/ebook-convert:test --format 'size={{.Size}} id={{.Id}}'

      - name: Publish 1.0.0
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cyxno/ebook-convert:1.0.0
            ghcr.io/cyxno/ebook-convert:1.0
            ghcr.io/cyxno/ebook-convert:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Cyxno/ebook-convert
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.description=Minimal Calibre ebook-convert runtime
          provenance: mode=max
          sbom: true
